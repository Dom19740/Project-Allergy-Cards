<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create and share personalized allergy alert cards in multiple languages. Quick, easy and travel-friendly." />
    <meta name="theme-color" content="#dc2626" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <title>Simple Allergy Alert</title>
    <link rel="canonical" href="https://app.simpleallergyalert.com/" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured data so search engines can surface this as an app, not
         just a generic page (eligible for app-style rich results). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Simple Allergy Alert",
        "alternateName": "Allergy Card App",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Android, iOS, Web",
        "url": "https://app.simpleallergyalert.com/",
        "description": "Create translated allergy alert cards in 100+ languages to show restaurants, hotels and hosts exactly what you can't eat, anywhere in the world.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Favicons / App icons (served from public/) -->
    <link rel="icon" href="/favicon.ico" />
    <!-- SVG icon for modern browsers -->
    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />
    <!-- Apple touch icon (used when adding to home screen on iOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/logo_main.png" />
    <!-- Fallback PNG icon (some platforms expect PNG) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <!-- Optional mask icon for Safari pinned tabs (uses placeholder.svg) -->
    <link rel="mask-icon" href="/placeholder.svg" color="#5bbad5" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
