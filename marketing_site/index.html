        /* Ensure images reserve space to avoid layout shifts while loading */
        .carousel-slide {
            display: block;
            width: 100%;
            height: 100%;
            aspect-ratio: 4 / 7;
            object-fit: contain;

        @media (min-width: 640px) {

            .carousel-item button {

                height: 100%;
                width: auto;

    <script>
        (function () {
            function initCarousel() {
                const slideButtons = Array.from(document.querySelectorAll('.carousel-slide'));
                const slideItems = Array.from(document.querySelectorAll('.carousel-item'));
                const dots = Array.from(document.querySelectorAll('.carousel-dot'));
                const prevBtn = document.getElementById('carouselPrev');
                const nextBtn = document.getElementById('carouselNext');
                const overlay = document.getElementById('carouselOverlay');
                const overlayImage = document.getElementById('carouselOverlayImage');
                const overlayClose = document.getElementById('carouselOverlayClose');
                const track = document.getElementById('carouselTrack');
                const totalSlides = slideItems.length;
                let visibleSlides = 3;
                let maxIndex = Math.max(0, totalSlides - visibleSlides);
                let currentIndex = 0;
                let autoRotate;

                function getVisibleSlides() {
                    if (window.innerWidth < 640) return 1;
                    if (window.innerWidth < 1024) return 2;
                    return 3;
                }

                function updateCarouselSettings() {
                    visibleSlides = getVisibleSlides();
                    maxIndex = Math.max(0, totalSlides - visibleSlides);
                    currentIndex = Math.min(maxIndex, currentIndex);
                }

                function updateTrack(index, smooth = true) {
                    const slide = slideItems[index];
                    if (!slide) return;
                    slide.scrollIntoView({
                        behavior: smooth ? 'smooth' : 'auto',
                        inline: 'start',
                        block: 'nearest'
                    });
                }

                function handleResize() {
                    updateCarouselSettings();
                    showSlide(currentIndex, false);
                }

                function showSlide(index, smooth = true) {
                    currentIndex = Math.min(maxIndex, Math.max(0, index));
                    updateTrack(currentIndex, smooth);
                    dots.forEach((dot, dotIndex) => {
                        dot.classList.toggle('bg-white/90', dotIndex === currentIndex);
                        dot.classList.toggle('bg-white/50', dotIndex !== currentIndex);
                    });
                }

                function nextSlide() {
                    showSlide(currentIndex >= maxIndex ? 0 : currentIndex + 1);
                }

                function prevSlide() {
                    showSlide(currentIndex <= 0 ? maxIndex : currentIndex - 1);
                }

                function startAutoRotate() {
                    if (autoRotate) clearInterval(autoRotate);
                    autoRotate = setInterval(nextSlide, 4500);
                }

                function openOverlay(img) {
                    overlayImage.src = img.src;
                    overlayImage.alt = img.alt;
                    overlay.classList.remove('hidden');
                    overlay.classList.add('flex');
                }

                function closeOverlay() {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    overlayImage.src = '';
                }

                slideButtons.forEach(slide => {
                    slide.addEventListener('click', () => {
                        openOverlay(slide);
                    });
                });

                dots.forEach(dot => {
                    dot.addEventListener('click', () => {
                        showSlide(Number(dot.dataset.index));
                        startAutoRotate();
                    });
                });

                prevBtn.addEventListener('click', () => {
                    prevSlide();
                    startAutoRotate();
                });

                nextBtn.addEventListener('click', () => {
                    nextSlide();
                    startAutoRotate();
                });

                overlayClose.addEventListener('click', closeOverlay);
                overlay.addEventListener('click', (event) => {
                    if (event.target === overlay) {
                        closeOverlay();
                    }
                });
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        closeOverlay();
                    }
                });

                updateCarouselSettings();
                showSlide(currentIndex, false);

                startAutoRotate();

                window.addEventListener('resize', handleResize);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initCarousel);
            } else {
                initCarousel();
            }
        })();

    </script>
